version: '3.8'

services:
  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    container_name: agi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agi_platform
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - agi_network

  redis:
    image: redis:7-alpine
    container_name: agi_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - agi_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agi_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agi_network

  postgres:
    image: postgres:15-alpine
    container_name: agi_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agi_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - agi_network

  backup:
    image: postgres:15-alpine
    container_name: agi_backup
    restart: "no"
    volumes:
      - ./backups:/backups
      - postgres_data:/var/lib/postgresql/data:ro
    environment:
      - PGPASSWORD=postgres
    command: >
      sh -c "
      pg_dump -h postgres -U postgres agi_platform > /backups/pg_\$(date +%Y%m%d_%H%M%S).sql &&
      find /backups -type f -mtime +7 -delete"
    networks:
      - agi_network

networks:
  agi_network:
    driver: bridge

volumes:
  redis_data:
  qdrant_data:
  postgres_data:
